[from-internal]
; === IVR Main Menu with DTMF ===
exten => 100,1,Answer()
 same => n,Wait(0.5)
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Set(TIMEOUT(response)=10)
 same => n(menu),Background(custom/ivr-main-menu)
 same => n,WaitExten(5)
 same => n,Goto(menu)

; DTMF 1 = Sales (recording + voice agent)
exten => 1,1,Playback(custom/ivr-sales)
 same => n,Stasis(dograh)
 same => n,Hangup()

; DTMF 2 = Support (recording + voice agent)
exten => 2,1,Playback(custom/ivr-support)
 same => n,Stasis(dograh)
 same => n,Hangup()

; DTMF 3 = Business Hours (recording only)
exten => 3,1,Playback(custom/ivr-hours)
 same => n,Hangup()

exten => _9XXX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

exten => _X.,1,Hangup()

[from-external]
; --- Dograh ARI inbound ---
exten => 8000,1,NoOp(=== Dograh Voice AI inbound ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Stasis(dograh)
 same => n,Hangup()

; Catch-all for extensions registered in Dograh telephony UI
exten => _X.,1,NoOp(Inbound call to ${EXTEN})
 same => n,Stasis(dograh)
 same => n,Hangup()
