[from-internal]
; ============================================================
; Main IVR (*100) — Piper TTS voice prompts
; ============================================================
exten => *100,1,Answer()
 same => n,Wait(1)
 same => n,Background(ivr/ivr-welcome)
 same => n,WaitExten(10)
 same => n,Playback(ivr/ivr-goodbye)
 same => n,Hangup()

exten => 0,1,Playback(ivr/ivr-operator)
 same => n,Dial(PJSIP/9001,30)
 same => n,Hangup()

exten => 1,1,Playback(ivr/ivr-sales)
 same => n,Dial(PJSIP/9000,30)
 same => n,Hangup()

exten => 2,1,Playback(ivr/ivr-support)
 same => n,Dial(PJSIP/9001,30)
 same => n,Hangup()

exten => i,1,Playback(ivr/ivr-invalid)
 same => n,Goto(*100,3)

exten => 100,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; ============================================================
; Digital Training (*200) — routes to [training] context
; ============================================================
exten => *200,1,Answer()
 same => n,Wait(1)
 same => n,Goto(training,menu,1)

; Inter-extension dialing
exten => _9XXX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

exten => _X.,1,Hangup()

[from-external]
; ============================================================
; Africa's Talking inbound routing
; ============================================================
; Short code → Training IVR
exten => _X.,1,NoOp(Inbound from Africa's Talking: ${CALLERID(num)} → ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(training,menu,1)
 same => n,Hangup()

[training]
; Language selection
exten => menu,1,Background(training/lang-select)
 same => n,WaitExten(15)
 same => n,Playback(training/goodbye)
 same => n,Hangup()

; English
exten => 1,1,Playback(training/lang-english)
 same => n(modules),Background(training/modules)
 same => n,WaitExten(15)
 same => n,Goto(menu)
exten => 11,1,GotoIf($[${EXISTS(${SOUNDS}/en/training/english/module1)}]?play:missing)
 same => n(missing),Playback(training/no-module)
 same => n,Goto(1,modules)
 same => n(play),Playback(training/english/module1)
 same => n,Goto(1,modules)

; Bemba
exten => 2,1,Playback(training/lang-bemba)
 same => n(modules),Background(training/modules)
 same => n,WaitExten(15)
 same => n,Goto(menu)
exten => 21,1,GotoIf($[${EXISTS(${SOUNDS}/en/training/bemba/module1)}]?play:missing)
 same => n(missing),Playback(training/no-module)
 same => n,Goto(2,modules)
 same => n(play),Playback(training/bemba/module1)
 same => n,Goto(2,modules)

; Nyanja
exten => 3,1,Playback(training/lang-nyanja)
 same => n(modules),Background(training/modules)
 same => n,WaitExten(15)
 same => n,Goto(menu)
exten => 31,1,GotoIf($[${EXISTS(${SOUNDS}/en/training/nyanja/module1)}]?play:missing)
 same => n(missing),Playback(training/no-module)
 same => n,Goto(3,modules)
 same => n(play),Playback(training/nyanja/module1)
 same => n,Goto(3,modules)

; Swahili
exten => 4,1,Playback(training/lang-swahili)
 same => n(modules),Background(training/modules)
 same => n,WaitExten(15)
 same => n,Goto(menu)
exten => 41,1,GotoIf($[${EXISTS(${SOUNDS}/en/training/swahili/module1)}]?play:missing)
 same => n(missing),Playback(training/no-module)
 same => n,Goto(4,modules)
 same => n(play),Playback(training/swahili/module1)
 same => n,Goto(4,modules)

; Back to language menu
exten => 9,1,Goto(menu)

; Invalid
exten => i,1,Playback(training/no-module)
 same => n,Goto(menu)
