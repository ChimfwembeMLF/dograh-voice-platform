services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dograh-db}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d ${POSTGRES_DB:-dograh-db}
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - app-network
  coturn:
    image: coturn/coturn:4.8.0
    restart: unless-stopped
    command:
      - -n
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49152
      - --max-port=49200
      - --external-ip=${TURN_HOST}
      - --realm=dograh.com
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --log-file=stdout
    ports:
      - 3478:3478/udp
      - 3478:3478/tcp
      - 5349:5349/udp
      - 5349:5349/tcp
      - 49152-49200:49152-49200/udp
    networks:
      - app-network
  api:
    image: ${REGISTRY:-dograhai}/dograh-api:${DOGRAH_VERSION:-latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_API_ENDPOINT: https://${PUBLIC_HOST}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dograh-db}}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      ENABLE_AWS_S3: "true"
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_SIGNATURE_VERSION: ${S3_SIGNATURE_VERSION:-s3v4}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      FASTAPI_WORKERS: "1"
      FORWARDED_ALLOW_IPS: "*"
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      TURN_HOST: ${TURN_HOST:?TURN_HOST is required for WebRTC media}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET is required for WebRTC media}
      FORCE_TURN_RELAY: ${FORCE_TURN_RELAY:-false}
      OSS_JWT_SECRET: ${OSS_JWT_SECRET:?OSS_JWT_SECRET must be set to a strong secret}
      ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-false}
      POSTHOG_API_KEY: phc_ItizB1dP6yv7ZYobbcqrpxTdbomDA8hJFSEmAMdYvIr
      POSTHOG_HOST: https://us.i.posthog.com
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-21-web.rule=Host(`dograh.tekreminnovations.com`)
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-21-web.entrypoints=web
      - traefik.http.services.voiceagentplatform-ivr-b5lhvg-21-web.loadbalancer.server.port=8000
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-21-web.service=voiceagentplatform-ivr-b5lhvg-21-web
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-21-web.middlewares=redirect-to-https@file
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-21-websecure.rule=Host(`dograh.tekreminnovations.com`)
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-21-websecure.entrypoints=websecure
      - traefik.http.services.voiceagentplatform-ivr-b5lhvg-21-websecure.loadbalancer.server.port=8000
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-21-websecure.service=voiceagentplatform-ivr-b5lhvg-21-websecure
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-21-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.dograh-api.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.dograh-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.dograh-api.tls=true
      - traefik.http.routers.dograh-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.dograh-api.priority=10
      - traefik.http.services.dograh-api.loadbalancer.server.port=8000
    networks:
      - app-network
      - traefik
      - voice-network
      - dokploy-network
      - default
  ui:
    image: ${REGISTRY:-dograhai}/dograh-ui:${DOGRAH_VERSION:-latest}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
      NODE_ENV: oss
      ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-false}
      POSTHOG_KEY: phc_ItizB1dP6yv7ZYobbcqrpxTdbomDA8hJFSEmAMdYvIr
      POSTHOG_HOST: https://us.posthog.com
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:3010 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-16-web.rule=Host(`app.tekreminnovations.com`)
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-16-web.entrypoints=web
      - traefik.http.services.voiceagentplatform-ivr-b5lhvg-16-web.loadbalancer.server.port=3010
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-16-web.service=voiceagentplatform-ivr-b5lhvg-16-web
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-16-web.middlewares=redirect-to-https@file
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-16-websecure.rule=Host(`app.tekreminnovations.com`)
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-16-websecure.entrypoints=websecure
      - traefik.http.services.voiceagentplatform-ivr-b5lhvg-16-websecure.loadbalancer.server.port=3010
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-16-websecure.service=voiceagentplatform-ivr-b5lhvg-16-websecure
      - traefik.http.routers.voiceagentplatform-ivr-b5lhvg-16-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.dograh-ui.rule=Host(`${PUBLIC_HOST}`)
      - traefik.http.routers.dograh-ui.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.dograh-ui.tls=true
      - traefik.http.routers.dograh-ui.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.dograh-ui.priority=1
      - traefik.http.services.dograh-ui.loadbalancer.server.port=3010
    networks:
      - app-network
      - traefik
      - dokploy-network
      - default
  whisper:
    image: hwdsl2/whisper-server
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
    volumes:
      - whisper_data:/var/lib/whisper
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://127.0.0.1:9000/v1/models
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - voice-network
  piper:
    build:
      context: .
      dockerfile: Dockerfile.piper
    restart: unless-stopped
    environment:
      PIPER_MODEL: ${PIPER_MODEL:-en_US-lessac-medium}
      PIPER_VOICE_DIR: /data
    volumes:
      - piper_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://127.0.0.1:5000/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - voice-network
  sip-connector:
    profiles:
      - sip-connector
    build:
      context: .
      dockerfile: Dockerfile.sip
    restart: unless-stopped
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-https://ai.tekreminnovations.com/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:9000}
      PIPER_URL: ${PIPER_URL:-http://piper:5000}
      SIP_HOST: ${SIP_HOST:-}
      SIP_PORT: ${SIP_PORT:-5060}
      SIP_EXTENSION: ${SIP_EXTENSION:-9000}
      SIP_SECRET: ${SIP_SECRET:-}
      SIP_LOCAL_IP: ${SIP_LOCAL_IP:-}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-You are a helpful voice assistant on a phone call. Keep replies concise and conversational.}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-120}
      SIP_REGISTER_INTERVAL: ${SIP_REGISTER_INTERVAL:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - ${SIP_CONNECTOR_PORT:-8080}:8080
    depends_on:
      whisper:
        condition: service_healthy
      piper:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - voice-network
  prometheus:
    profiles:
      - monitoring
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - ${PROMETHEUS_PORT:-9090}:9090
    networks:
      - voice-network
volumes:
  postgres_data: null
  whisper_data: null
  piper_data: null
  prometheus_data: null
networks:
  app-network:
    driver: bridge
  voice-network:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-dokploy-network}
  dokploy-network:
    external: true
